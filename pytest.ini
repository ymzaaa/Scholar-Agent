[pytest]
testpaths = tests
pythonpath = . stage1 backend
addopts = --strict-config --strict-markers -ra --basetemp=.pytest-tmp
markers =
    real_data: 使用仓库内真实论文输入的测试
    latex: 需要本机 XeLaTeX/BibTeX 的测试
    e2e: 完整 CLI 端到端阶段门禁
    slow: 运行时间较长的测试
    real_excerpt: 从真实论文抽取有限内容的测试
    agent: Agent状态、工具调用和受约束循环测试
    real_llm: 需要显式授权并调用真实外部大语言模型的隔离测试
